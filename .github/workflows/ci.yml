name: TMS CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.11'
  MIN_COVERAGE: 75

jobs:
  lint:
    name: 'Lint & Static Analysis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: pip install flake8 pylint mypy bandit
      - run: flake8 src/ --max-line-length=100
      - run: pylint src/ --disable=all --enable=E,F --score=y
      - run: mypy src/ --ignore-missing-imports

  test:
    name: 'Tests & Coverage'
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: pytest --cov=src --cov-report=xml --cov-fail-under=${{ env.MIN_COVERAGE }}

  security:
    name: 'Security Check'
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit
      - run: bandit -r src/ -ll -q